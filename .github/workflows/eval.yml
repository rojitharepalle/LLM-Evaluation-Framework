name: LLM Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest sample data
        run: python scripts/ingest.py
        env:
          EMBEDDING_PROVIDER: local
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          CHROMA_PERSIST_DIR: ./chroma_db

      - name: Run evaluation suite
        run: python scripts/run_eval.py --no-ragas --ci
        env:
          EMBEDDING_PROVIDER: local
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          CHROMA_PERSIST_DIR: ./chroma_db

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: evaluation/results/

      - name: Post eval summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const resultsDir = 'evaluation/results'
            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.json'))
            if (!files.length) return
            const latest = JSON.parse(fs.readFileSync(path.join(resultsDir, files[files.length-1])))
            const s = latest.summary
            const rate = (s.hallucination_rate * 100).toFixed(1)
            const gate = s.hallucination_rate <= 0.1 ? '✅ PASSED' : '❌ FAILED'
            const body = [
              '## 🧪 LLM Evaluation Results',
              '',
              `**CI/CD Gate: ${gate}**`,
              '',
              '| Metric | Score |',
              '|--------|-------|',
              `| Faithfulness | ${(s.faithfulness*100).toFixed(1)}% |`,
              `| Answer Relevancy | ${(s.answer_relevancy*100).toFixed(1)}% |`,
              `| Context Recall | ${(s.context_recall*100).toFixed(1)}% |`,
              `| Hallucination Rate | ${rate}% |`,
              '',
              `**${s.flagged_questions} / ${s.total_questions} questions flagged**`,
            ].join('\n')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
